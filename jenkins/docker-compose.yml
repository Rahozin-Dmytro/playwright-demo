services:
  jenkins:
    build: .
    container_name: jenkins
    environment:
      # Вимикає CSP, інакше HTML-звіт Playwright відкривається чорним
      # (лише для локального навчання)
      JAVA_OPTS: >-
        -Dhudson.model.DirectoryBrowserSupport.CSP=""
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home   # налаштування і історія збірок
volumes:
  jenkins_home:
