services:
  jenkins:
    build: .
    container_name: jenkins
    environment:
      # дозволяє checkout з локальної папки /repo (лише для локального навчання)
      JAVA_OPTS: "-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home   # налаштування і історія збірок
      - ..:/repo:ro                      # наш проєкт (лише читання), джерело для Pipeline
volumes:
  jenkins_home:
