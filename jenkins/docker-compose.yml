services:
  jenkins:
    build: .
    container_name: jenkins
    environment:
      # 1) дозволяє checkout з локальної папки /repo
      # 2) вимикає CSP, інакше HTML-звіт Playwright відкривається чорним
      # (обидва налаштування лише для локального навчання)
      JAVA_OPTS: >-
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
        -Dhudson.model.DirectoryBrowserSupport.CSP=""
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home   # налаштування і історія збірок
      - ..:/repo:ro                      # наш проєкт (лише читання), джерело для Pipeline
volumes:
  jenkins_home:
